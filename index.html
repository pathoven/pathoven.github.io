<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pathoven Drive Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pathoven Drive - ROS2 Autonomous RC Car Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- Custom styles -->
  <style>
    :root {
      --base-color: #2c3e50;
      --theme-color: #42b983;
      --sidebar-width: 280px;
    }
    
    .app-name-link img {
      width: 120px;
    }
    
    .markdown-section {
      max-width: 900px;
    }
    
    /* Language switcher */
    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      gap: 10px;
    }
    
    .lang-switcher button {
      padding: 8px 15px;
      background: var(--theme-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .lang-switcher button:hover {
      opacity: 0.8;
    }
    
    .lang-switcher button.active {
      background: var(--base-color);
    }
    
    /* Better code blocks */
    pre[data-lang] {
      border-radius: 8px;
    }
    
    /* Improved sidebar */
    .sidebar {
      background: #f8f9fa;
    }
    
    .sidebar-nav > ul > li > p {
      font-weight: 600;
      color: var(--base-color);
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  
  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button onclick="switchLang('tr')" id="btn-tr">🇹🇷 TR</button>
    <button onclick="switchLang('en')" id="btn-en">🇬🇧 EN</button>
  </div>
  
  <script>
    // Language switcher
    function switchLang(lang) {
      const currentPath = window.location.hash.replace('#/', '');
      
      // Update active button
      document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      // Navigate to language
      if (lang === 'tr') {
        window.location.hash = '#/tr/';
      } else if (lang === 'en') {
        window.location.hash = '#/en/';
      }
      
      // Save preference
      localStorage.setItem('docsify-lang', lang);
    }
    
    // Detect and set initial language
    function detectLanguage() {
      const hash = window.location.hash;
      const savedLang = localStorage.getItem('docsify-lang');
      const browserLang = navigator.language || navigator.userLanguage;
      
      if (hash.includes('/tr/')) {
        return 'tr';
      } else if (hash.includes('/en/')) {
        return 'en';
      } else if (savedLang) {
        return savedLang;
      } else if (browserLang.startsWith('tr')) {
        return 'tr';
      }
      return 'en';
    }
    
    // Set initial language on load
    window.addEventListener('load', function() {
      const lang = detectLanguage();
      switchLang(lang);
    });
    
    // Docsify configuration
    window.$docsify = {
      name: 'Pathoven Drive',
      repo: 'https://github.com/pathoven/pathoven.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      executeScript: true,
      
      // Search plugin
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/tr/': '🔍 Ara...',
          '/en/': '🔍 Search...',
          '/': '🔍 Search...'
        },
        noData: {
          '/tr/': 'Sonuç bulunamadı!',
          '/en/': 'No results found!',
          '/': 'No results found!'
        },
        depth: 3
      },
      
      // Pagination
      pagination: {
        previousText: {
          '/tr/': 'ÖNCEKİ',
          '/en/': 'PREVIOUS',
          '/': 'PREVIOUS'
        },
        nextText: {
          '/tr/': 'SONRAKİ',
          '/en/': 'NEXT',
          '/': 'NEXT'
        },
        crossChapter: true,
        crossChapterText: true
      },
      
      // Copy code
      copyCode: {
        buttonText: {
          '/tr/': 'Kopyala',
          '/en/': 'Copy',
          '/': 'Copy'
        },
        errorText: {
          '/tr/': 'Hata',
          '/en/': 'Error',
          '/': 'Error'
        },
        successText: {
          '/tr/': 'Kopyalandı',
          '/en/': 'Copied',
          '/': 'Copied'
        }
      },
      
      // Tabs plugin
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic'
      },
      
      // Alias for language routing
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/tr/_sidebar.md': '/tr/_sidebar.md',
        '/en/_sidebar.md': '/en/_sidebar.md'
      }
    }
  </script>
  
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  
  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  
  <!-- Emoji support -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  
  <!-- External link -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
  
  <!-- Zoom image -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
