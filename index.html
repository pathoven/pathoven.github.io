<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pathoven Drive Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pathoven Drive - ROS2 Autonomous RC Car Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --base-color: #2c3e50; --theme-color: #42b983; }
    .lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; gap: 10px; }
    .lang-switcher button { padding: 8px 15px; background: var(--theme-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <div class="lang-switcher">
    <button onclick="switchLang('tr')" id="btn-tr">ðŸ‡¹ðŸ‡· TR</button>
    <button onclick="switchLang('en')" id="btn-en">ðŸ‡¬ðŸ‡§ EN</button>
  </div>
  <script>
    function switchLang(lang) {
      document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      if (lang === 'tr') { window.location.hash = '#/tr/'; } 
      else if (lang === 'en') { window.location.hash = '#/en/'; }
      localStorage.setItem('docsify-lang', lang);
    }
    function detectLanguage() {
      const hash = window.location.hash;
      const savedLang = localStorage.getItem('docsify-lang');
      if (hash.includes('/tr/')) return 'tr';
      else if (hash.includes('/en/')) return 'en';
      else if (savedLang) return savedLang;
      return 'en';
    }
    window.addEventListener('load', function() { switchLang(detectLanguage()); });
    window.$docsify = {
      name: 'Pathoven Drive',
      repo: 'https://github.com/pathoven/pathoven.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: { paths: 'auto', placeholder: { '/tr/': 'ðŸ” Ara...', '/en/': 'ðŸ” Search...', '/': 'ðŸ” Search...' }, depth: 3 },
      alias: { '/tr/_sidebar.md': '/tr/_sidebar.md', '/en/_sidebar.md': '/en/_sidebar.md' }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
