<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pathoven Drive Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pathoven Drive - ROS2 Autonomous RC Car Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
    }
    .lang-switcher button {
      padding: 8px 15px;
      margin-left: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-switcher button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="app">Yükleniyor...</div>
  
  <div class="lang-switcher">
    <button onclick="location.href='#/tr/'">🇹🇷 TR</button>
    <button onclick="location.href='#/en/'">🇬🇧 EN</button>
  </div>
  
  <script>
    window.$docsify = {
      name: 'Pathoven Drive',
      repo: 'https://github.com/pathoven/pathoven.github.io',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md'
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
